# Workflow автоматической публикации статического сайта на GitHub Pages.
# Файл размещается в репозитории по пути: .github/workflows/deploy.yml
name: Deploy static site

# Триггер: workflow запускается при каждом push в ветку main
on:
  push:
    branches: [ main ]

# Права доступа, необходимые для публикации на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: HTML Linting
        run: npx htmlhint index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
